name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/saffnco_supplychain-dash_frontend_app:latest

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/saffnco_supplychain-dash_backend_app:latest

  deploy:
    name: Deploy to Container Server
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/saffnco_supplychain-dash_backend_app:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: BACKEND_ENV,DOCKER_IMAGE_BACKEND
          script: |
            docker pull "$DOCKER_IMAGE_BACKEND"
            docker stop supplychain-dash_backend_app 2>/dev/null || true
            docker rm supplychain-dash_backend_app 2>/dev/null || true
            docker network create supplychain-dash-network 2>/dev/null || true
            docker run -d --name supplychain-dash_backend_app --network supplychain-dash-network --restart unless-stopped -p 4020:4020 -e BACKEND_ENV="$BACKEND_ENV" "$DOCKER_IMAGE_BACKEND"

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1
        env:
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/saffnco_supplychain-dash_frontend_app:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_API_KEY,DOCKER_IMAGE_FRONTEND
          script: |
            docker pull "$DOCKER_IMAGE_FRONTEND"
            docker stop supplychain-dash_frontend_app 2>/dev/null || true
            docker rm supplychain-dash_frontend_app 2>/dev/null || true
            docker network create supplychain-dash-network 2>/dev/null || true
            docker run -d --name supplychain-dash_frontend_app --network supplychain-dash-network --restart unless-stopped -p 4021:4021 -e API_BASE_URL=http://supplychain-dash_backend_app:4020/api -e APP_API_KEY="$APP_API_KEY" "$DOCKER_IMAGE_FRONTEND"
